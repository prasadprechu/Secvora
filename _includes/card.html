<article class="card">
  <a class="card-image" href="{{ post.url | relative_url }}">
    {% if post.image %}
      <img src="{{ post.image }}" alt="{{ post.title | escape }}" loading="lazy">
    {% else %}
      <span>SECVORA</span>
    {% endif %}
  </a>

  <div class="card-body">
    <a class="post-category" href="{{ '/' | append: post.category_slug | append: '/' | relative_url }}">
      {{ post.category }}
    </a>

    <h3>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h3>

    <p>{{ post.description }}</p>

    <div class="meta">
      {{ post.date | date: '%b %-d, %Y' }}
      {% if post.read_time %}
        · {{ post.read_time }} min read
      {% endif %}
    </div>
  </div>
</article>
