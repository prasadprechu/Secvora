<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | Secvora
    {% else %}
      Secvora | Cybersecurity Insights
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">S</span>
        <span>Secvora</span>
      </a>

      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>

    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>

    <div class="container footer-inner">

      <div>
        <strong>Secvora</strong>
        <p>
          Cybersecurity, AI and application security insights.
        </p>
      </div>

      <div>
        <a href="{{ '/' | relative_url }}">Home</a>
        ·
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        ·
        <a href="{{ '/about/' | relative_url }}">About</a>
      </div>

    </div>

    <div class="container footer-bottom">
      © {{ 'now' | date: '%Y' }} Secvora. All rights reserved.
    </div>

  </footer>

</body>
</html>
